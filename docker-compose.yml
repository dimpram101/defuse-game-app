# Production: app + Postgres + Caddy. Needs DOMAIN, GM_PIN and POSTGRES_PASSWORD in .env.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://defuse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/defuse
      GM_PIN: ${GM_PIN:?set GM_PIN}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB
    environment:
      POSTGRES_USER: defuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: defuse
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defuse"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
